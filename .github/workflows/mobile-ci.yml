# Flutter static analysis. Run tests locally with make test-mobile.
#
# Independent of the main "Lint and type-check" workflow: this
# checks Flutter static analysis without blocking backend/web PRs. Runs only when
# mobile/ (or this workflow) changes.
name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  flutter:
    name: Flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        # Info-level lints (e.g. Riverpod `.stream` deprecation) don't
        # fail the build; warnings/errors do.
        run: flutter analyze --no-fatal-infos
