# Production-like Docker Compose topology for SignUpFlow.
# Startup fails until required secrets and HTTPS origins are supplied. This file
# is not production acceptance; use the release roadmap before deployment.

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: signupflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signupflow}
      POSTGRES_USER: ${POSTGRES_USER:-signupflow}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # For database backups
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signupflow} -d ${POSTGRES_DB:-signupflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signupflow-network

  # ============================================================================
  # Redis (for caching, rate limiting, sessions)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: signupflow-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signupflow-network

  # ============================================================================
  # SignUpFlow FastAPI Backend
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signupflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_URL: "postgresql://${POSTGRES_USER:-signupflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-signupflow}"

      # Redis/Celery Configuration
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0"

      # Application Configuration
      ENVIRONMENT: "production"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY}"
      ACCESS_TOKEN_EXPIRE_HOURS: "${ACCESS_TOKEN_EXPIRE_HOURS:-24}"
      APP_URL: "${APP_URL:?Set APP_URL to the public HTTPS browser origin}"
      API_BASE_URL: "${API_BASE_URL:?Set API_BASE_URL to the public HTTPS API origin}"
      FRONTEND_URL: "${FRONTEND_URL:?Set FRONTEND_URL to the public HTTPS browser origin}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
      TESTING: "false"
      DEBUG: "false"
      DEBUG_RETURN_RESET_TOKEN: "false"
      DISABLE_RATE_LIMITS: "false"
      DISABLE_USAGE_LIMITS: "false"
      SIGNUPFLOW_ALLOW_TEST_CLOCK: "false"
      SECURITY_HSTS_ENABLED: "true"
      SECURITY_HSTS_MAX_AGE: "${SECURITY_HSTS_MAX_AGE:-31536000}"
      SECURITY_CSP_ENABLED: "true"

      # Email Configuration (SendGrid)
      SENDGRID_API_KEY: "${SENDGRID_API_KEY:-}"
      EMAIL_FROM: ${EMAIL_FROM:-noreply@signupflow.io}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}

      # SMS Configuration (Twilio)
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER:-}"
      SMS_ENABLED: ${SMS_ENABLED:-false}

      # Stripe Configuration
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      BILLING_ENABLED: ${BILLING_ENABLED:-false}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - signupflow-network

  # ============================================================================
  # Celery Worker (for background tasks - optional, future use)
  # ============================================================================
  # celery:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: signupflow-celery
  #   restart: unless-stopped
  #   command: celery -A api.celery_app worker --loglevel=info
  #   depends_on:
  #     - redis
  #     - db
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-signupflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-signupflow}
  #     REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  #   networks:
  #     - signupflow-network

# ============================================================================
# Volumes (persistent data storage)
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  signupflow-network:
    driver: bridge
