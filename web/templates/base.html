<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ request.state.csrf_token }}">
  <title>{% block title %}SignUpFlow{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/web/static/css/styles.css?v=20260923">
  <!-- No-flash theme: apply persisted/system theme before first paint. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sf-theme');
        if (!t) {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}' />
  <script src="/web/static/js/htmx.min.js" defer></script>
  <script src="/web/static/js/sse.js" defer></script>
  <script src="/web/static/js/alpine.min.js" defer></script>
  <script src="/web/static/js/recovery.js?v=20260914" defer></script>
  <script src="/web/static/js/request-integrity.js?v=20260914" defer></script>
</head>
<body>
  {# The section decides how wide the page may grow on larger screens:
     admin pages get the most room, volunteer pages less, and sign-in and
     other standalone pages stay a narrow card. #}
  {% set path = request.url.path %}
  <div class="app {{ 'app-admin' if path.startswith('/a/') else ('app-member' if path.startswith('/v/') else 'app-plain') }}">
    <div id="request-status" class="request-status" role="alert" tabindex="-1" hidden></div>
    {% block body %}{% endblock %}
  </div>
</body>
</html>
